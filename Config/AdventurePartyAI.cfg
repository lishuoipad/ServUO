# Adventure Party AI

# Keep this false until you have tested one party manually with [AdventurePartyAI on.
EnabledByDefault=false

# Mock is local and offline. HttpEndpoint calls AdventurePartyAI.HttpEndpointUrl.
DefaultProvider=Mock

# ServUO should normally call a local bridge, not the remote AI provider directly.
HttpEndpointUrl=http://127.0.0.1:8787/decide

# Leave this blank when using the local bridge. Put API keys in the bridge environment, not in ServUO saves.
HttpAuthorizationHeader=

RequestCooldown=00:00:00:20
FailureCooldown=00:00:01:00
RequestTimeout=00:00:00:03
DecisionMaxAge=00:00:00:45
